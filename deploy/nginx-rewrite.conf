# ============================================================
# nginx 片段（可选）
#
# 全站只有一个入口 public/index.php，路由由 PHP 解析 REQUEST_URI 分发，
# 所以路由里不会出现 .php。这里要做的只有一件事：把找不到的路径交给它。
#
# 这是 Flarum、开放平台都在用的标准写法，不针对任何面板。
#
# 放哪：
#   宝塔   —— 网站 → 设置 → 伪静态，整段粘进去保存（重建站点也不会冲掉）
#   裸 nginx —— 放进 server { } 里
#   Apache —— 不用它，public/.htaccess 已经写好了
# ============================================================

# 入口：不是真实文件的请求一律交给 index.php
location / {
    try_files $uri $uri/ /index.php?$query_string;
}

# 敏感文件防护。root 指向 public/ 时这些本来就在外面，
# 这条是防 root 配错位置的情况。
# 注意：不要照抄开放平台的 vendor —— 我们的 public/vendor 是
# Font Awesome 字体，deny 掉全站图标就没了。
location ~* ^/(\.git|composer\.(json|lock)|config\.php|\.lock|data|tests|bin|src|doc|deploy)(/|$) {
    deny all;
    return 404;
}

# 静态资源缓存

location ~* \.(?:manifest|appcache|html?|xml|json)$ {
    add_header Cache-Control "max-age=0";
}

location ~* \.(?:jpg|jpeg|gif|png|ico|svg|webp|mp4|ogg|ogv|webm)$ {
    add_header Cache-Control "max-age=2592000";
    access_log off;
}

location ~* \.(?:css|js)$ {
    add_header Cache-Control "max-age=31536000";
    access_log off;
}

location ~* \.(?:ttf|ttc|otf|eot|woff|woff2)$ {
    add_header Cache-Control "max-age=2592000";
    access_log off;
}

# 语音与聊天图，别被当静态资源长期缓存
location ^~ /uploads/ {
    expires 7d;
    add_header Cache-Control "public, max-age=604800";
    location ~* \.(php|phtml|phar|cgi|pl|py|sh)$ { deny all; }
}

gzip on;
gzip_comp_level 5;
gzip_min_length 256;
gzip_proxied any;
gzip_vary on;
gzip_types
    application/atom+xml
    application/javascript
    application/json
    application/ld+json
    application/manifest+json
    application/rss+xml
    application/vnd.geo+json
    application/vnd.ms-fontobject
    application/x-font-ttf
    application/x-web-app-manifest+json
    application/xhtml+xml
    application/xml
    font/opentype
    image/bmp
    image/svg+xml
    image/x-icon
    text/cache-manifest
    text/css
    text/javascript
    text/plain
    text/vcard
    text/vtt
    text/x-component;
