# ============================================================
# LightGroup · 独立 server 块（裸装 nginx 用）
#
# 用法（Debian / Ubuntu）：
#   cp deploy/nginx-server.conf /etc/nginx/sites-available/lightgroup.conf
#   ln -s /etc/nginx/sites-available/lightgroup.conf /etc/nginx/sites-enabled/
#   nginx -t && systemctl reload nginx
#
# 需要改三处：server_name、root、fastcgi_pass。
#
# 用宝塔或已有 server 块的环境不要用这个文件，用仓库根目录的 site.conf（片段）。
# 把完整 server 块 include 进别人的 server 里会报
#   "server" directive is not allowed here
# ============================================================
server {
    listen 80;
    listen [::]:80;
    server_name lightgroup.example.com;

    # web root 必须是 public/：源码、data/、config.php、.lock 都在它的上一级，外部访问不到
    root /srv/lightgroup/public;
    index index.php;

    # 上传：手机图片走 dataURL，base64 后体积约为原图的 1.34 倍
    client_max_body_size 12m;
    client_body_timeout 60s;

    charset utf-8;
    server_tokens off;

    # ---------- 伪静态：不是真实文件的请求全部交给入口 ----------
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # /g/ 开头那批接口也走上面那条：入口文件自己会交给兼容层

    # ---------- 静态资源 ----------
    # 前端资源都带 ?v= 版本号，可以放心长缓存
    # 用 ^~ 是为了让下面的 PHP 正则不要接管这里的路径
    location ^~ /assets/ {
        try_files $uri =404;
        expires 30d;
        access_log off;
        add_header Cache-Control "public, max-age=2592000, immutable";
    }

    location ^~ /vendor/ {
        try_files $uri =404;
        expires 30d;
        access_log off;
        add_header Cache-Control "public, max-age=2592000, immutable";
    }

    # 上传目录只发文件，任何脚本都不执行
    location ^~ /uploads/ {
        try_files $uri =404;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
        location ~* \.(php|phtml|phar|cgi|pl|py|sh)$ {
            deny all;
        }
    }

    location = /favicon.ico { access_log off; log_not_found off; try_files $uri =404; }
    location = /favicon.svg { access_log off; log_not_found off; try_files $uri =404; }
    location = /robots.txt  { access_log off; log_not_found off; try_files $uri =404; }

    # ---------- PHP ----------
    location ~ \.php$ {
        try_files $uri =404;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param HTTPS $https if_not_empty;
        fastcgi_index index.php;
        fastcgi_buffers 16 16k;
        fastcgi_buffer_size 32k;

        # 默认 unix socket；用 TCP 监听的话换成下面那行
        fastcgi_pass unix:/run/php/php8.3-fpm.sock;
        # fastcgi_pass 127.0.0.1:9000;

        # /g/api/wait 是长轮询，最多挂 25 秒，这里必须比它大
        fastcgi_read_timeout 120s;
        fastcgi_send_timeout 120s;
    }

    # ---------- 不要把隐藏文件、数据库、备份发出去 ----------
    # Let's Encrypt 的 webroot 验证要放行
    location ^~ /.well-known/ { allow all; }
    location ~ /\.(?!well-known) { deny all; }
    location ~* \.(?:sqlite|sqlite3|db|sql|log|ini|env|bak|swp|dist|lock)$ { deny all; }

    # ---------- 压缩 ----------
    gzip on;
    gzip_vary on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types text/plain text/css text/xml application/json application/javascript application/xml+rss image/svg+xml font/woff2;

    # ---------- 安全头 ----------
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

    # 上了 HTTPS 之后再打开 HSTS
    # add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    access_log /var/log/nginx/lightgroup.access.log;
    error_log  /var/log/nginx/lightgroup.error.log warn;
}

# ============================================================
