# ============================================================
# LightGroup · nginx include 片段
#
# 适用：宝塔面板，或任何已经在 server { } 里写好了 listen / server_name / root 的环境。
#   在站点的 nginx 配置文件的 server 块内加一行：
#       include /www/wwwroot/你的目录/site.conf;
#   然后 nginx -t && systemctl reload nginx
#
# 不适用：裸装 nginx 从零建站。那种情况用 deploy/nginx-server.conf。
#
# 这个文件里没有 server { } 外壳：它会被 include 进别人的 server 块。
# ============================================================

# 手机发的图走 dataURL，base64 后体积约为原图的 1.34 倍
client_max_body_size 12m;
client_body_timeout 60s;

# ---------- 兼容层入口 ----------
# /g/、/g/{群}/、/g/join、/g/api/* 都由唯一入口 public/index.php 自己分发，
# 所以这里不需要单独的 location /g/，下面那条 location / 就够了。

# ---------- 静态资源 ----------
location ^~ /assets/ {
    try_files $uri =404;
    expires 30d;
    access_log off;
    add_header Cache-Control "public, max-age=2592000, immutable";
}

location ^~ /vendor/ {
    try_files $uri =404;
    expires 30d;
    access_log off;
    add_header Cache-Control "public, max-age=2592000, immutable";
}

# 上传目录只发文件，脚本一律拒绝
location ^~ /uploads/ {
    try_files $uri =404;
    expires 30d;
    add_header Cache-Control "public, max-age=2592000";
    location ~* \.(php|phtml|phar|cgi|pl|py|sh)$ {
        deny all;
    }
}

location = /favicon.ico { access_log off; log_not_found off; try_files $uri =404; }
location = /favicon.svg { access_log off; log_not_found off; try_files $uri =404; }
location = /robots.txt  { access_log off; log_not_found off; try_files $uri =404; }

# ---------- 敏感文件 ----------
# Let's Encrypt 的 webroot 验证要放行
location ^~ /.well-known/ { allow all; }
location ~ /\.(?!well-known) { deny all; }
location ~* \.(?:sqlite|sqlite3|db|sql|log|ini|env|bak|swp|dist|lock)$ { deny all; }

# ---------- 压缩 ----------
gzip on;
gzip_vary on;
gzip_comp_level 5;
gzip_min_length 1024;
gzip_proxied any;
gzip_types text/plain text/css text/xml application/json application/javascript application/xml+rss image/svg+xml font/woff2;

# ---------- 404 交给程序渲染 ----------
# 宝塔模板里有 error_page 404 /404.html，PHP 返回的 404 会被 nginx 换成默认页，
# 用户看到的是「nginx 404」而不是站点自己的页面（接口还会拿到 HTML 而不是 JSON）。
# 关掉拦截，让 index.php 里的 notfound 页面原样返回。
fastcgi_intercept_errors off;

# ---------- 安全头 ----------
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "SAMEORIGIN" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
# 麦克风必须放行本站：语音消息靠 getUserMedia，写成 microphone=() 会让 Chrome
# 直接抛 NotAllowedError（用户看到的就是「拿不到麦克风权限」，且弹窗根本不会出现）。
# 地理位置/摄像头仍然全禁。
add_header Permissions-Policy "geolocation=(), microphone=(self), camera=()" always;

# 上了 HTTPS 之后再打开
# add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

# ---------- 入口兜底（必须有）----------
# 没有这一段，只有 / 会命中 index.php（因为 index 指令），
# /setup、/login、/app 这些「不是真实文件」的路径会被 nginx 直接 404：
#   GET  /setup   -> 404
#   POST /setup   -> 404  ← 安装向导提交失败就是这个
# 宝塔的默认模板不一定带 location /，所以这里默认给出。
#
# 如果站点配置里已经有 location / { try_files ... }，请把这一段删掉，
# 同一个 server 里出现两个 location / 会报 duplicate location。
location / {
    try_files $uri $uri/ /index.php?$query_string;
}
